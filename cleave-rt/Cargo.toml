[package]
name = "cleave-rt"
version = "0.1.0"
edition = "2024"

# `staticlib` alongside the default `rlib`: the JIT path (`main.rs`'s
# `--run`) still links this crate as an ordinary Rust dependency and
# registers each function by real pointer (`ExecutionEngine::register_
# symbol`), never touching the archive at all -- but a real `.o` produced by
# `--emit-object` (Axis B/A) needs its unresolved `cleave_rt::*` symbol
# references resolved by a genuine external linker afterward, which can only
# link against a real static archive, not a `.rlib` (Rust's own metadata-
# carrying format, not meant for a non-Rust or non-this-compiler-version
# linker to consume).
[lib]
crate-type = ["rlib", "staticlib"]

# Used only by the ownership diagnostics in `lib.rs` (`CLEAVE_DEBUG_POOL`,
# `CLEAVE_TRACE_RC`, `CLEAVE_TRACE_SIZE`) to resolve a release/retain call
# site back to its own `.cleave` source line -- `first_cleave_frame`/
# `cleave_frames`. Every one of those is env-var-gated and off by default,
# so nothing here runs in an ordinary build; the crate is linked regardless,
# which is the deliberate trade for having the diagnostics available on a
# release binary without rebuilding it.
[dependencies]
backtrace = "0.3"

# No OpenBLAS dependency declared here at all, deliberately -- `src/lib.rs`'s
# own `blas_dynload` module loads `openblas.dll` explicitly, at runtime, on
# first use (`LoadLibraryW`/`GetProcAddress`), not via an ordinary implicit
# link. Found necessary, not just preferred: an implicit `cargo:rustc-link-
# lib=dylib=openblas` (this crate's own former `build.rs`, since removed)
# makes *every* process that merely links `cleave-rt` -- including a
# consuming crate's own build script (`cleave-build`'s `compile()`, which
# only ever builds/validates a JIT `ExecutionEngine`, never executes
# anything) -- require `openblas.dll` resolvable at process*-creation* time,
# before any of that process's own code runs, in a directory with no single
# predictable location to copy a DLL into (`doc/backlog.md`'s own "OpenBLAS
# wired into cleave's own stdlib" item has the full story). Explicit, lazy
# loading means only a process that actually *calls* into this module ever
# needs `openblas.dll` to exist.
