[package]
name = "nanolm"
version = "0.1.0"
edition = "2024"

# See `examples/rust-interop-demo/Cargo.toml` for why this lives inside the root workspace.
# `--features vulkan`: the kernel compiled for the Vulkan backend
# (`doc/plan-vulkan.md`), its checkpoints in a directory of their own
# (`-vulkan`). `--features small`: a small model (`build.rs`, `SMALL`), to
# try a backend or a change at a scale that builds and runs in minutes.
[features]
vulkan = []
small = []

[build-dependencies]
cleave-build = { path = "../../cleave-build" }

# `corpus.rs`: the books are downloaded once from Project Gutenberg (plain UTF-8 text) and cached.
[dependencies]
ureq = "3"
