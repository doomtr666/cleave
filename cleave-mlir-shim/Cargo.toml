[package]
name = "cleave-mlir-shim"
version = "0.1.0"
edition = "2024"

# cleave's C API over MLIR and LLVM (`doc/plan-mlir-shim.md`): `cpp/shim.cpp`,
# compiled by `build.rs` with `cc` against the LLVM/MLIR prefix, and the Rust
# side over it (`src/mlir`: MLIR's C API declared by hand, and the IR API
# cleave builds with). `build.rs` also links LLVM and MLIR.

[build-dependencies]
cc = "1"
