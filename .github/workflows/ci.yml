name: ci

# Windows (MSVC) and Linux (x86_64), the same steps: the prebuilt LLVM/MLIR
# of `cleave-llvm-redist` and OpenBLAS of `cleave-openblas-redist` for each,
# fetched by the same scripts a dev machine runs (`pwsh` on Linux).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            toolchain: C:\llvm-mlir-22
          - os: ubuntu-24.04
            toolchain: /home/runner/llvm-mlir-22
    runs-on: ${{ matrix.os }}
    # Used to be 350 (a from-source LLVM+clang+MLIR+openmp build's own real
    # budget, `doc/backlog.md`'s "cleave-llvm-redist" entry) -- now just
    # downloading a prebuilt archive plus an ordinary `cargo build`/`test`,
    # a different order of magnitude entirely. Not yet measured on a cold
    # cache under this new shape; generous rather than exact until a real
    # run gives a number to tighten it against.
    # Raised from 60 when the example crates joined (their kernels, below):
    # nanoLM's alone compiles for several minutes on a 4-vCPU runner.
    timeout-minutes: 120
    steps:
      - name: Checkout cleave
        uses: actions/checkout@v4

      - name: Cache prebuilt cleave toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.toolchain }}
          # The release tag itself, not just its hash -- included directly
          # so bumping `ci/toolchain-version.txt` always busts the cache,
          # the same reasoning the old from-source cache key used for
          # `ci/llvm-cmake-flags.txt`.
          key: cleave-toolchain-${{ runner.os }}-${{ hashFiles('ci/toolchain-version.txt') }}

      # Needed unconditionally, cache hit or not -- `cargo build` itself
      # needs `link.exe` on an `-msvc` target regardless of where the
      # toolchain came from this run.
      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # `doc/backlog.md`'s "cleave-llvm-redist" entry -- a prebuilt release
      # of the exact same toolchain `ci/llvm-cmake-flags.txt`/`doc/
      # building.md`'s from-source path builds, published by a separate
      # repo's own CI so this one never pays that ~4-5h cost itself again.
      # Same script a fresh dev machine runs (`scripts/setup-toolchain.ps1`
      # `-CacheDir` -- `-ExistingPrefix` deliberately not used here, this is
      # exactly the "nothing cached yet" case it exists for) -- one
      # mechanism, not a CI-specific reimplementation of it.
      - name: Download prebuilt LLVM/MLIR/openmp toolchain (cache miss only)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/setup-toolchain.ps1 -CacheDir ${{ matrix.toolchain }}

      # Cache hit: the archive was never re-downloaded, so `.cargo/
      # config.toml` (gitignored, `CLEAVE_LLVM_PREFIX`)
      # was never (re)generated either -- still needed every run.
      - name: Point cargo at the toolchain
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: ./scripts/setup-toolchain.ps1 -ExistingPrefix ${{ matrix.toolchain }}

      # `cleave-rt` loads `openblas.dll` at runtime from `target\openblas`
      # (`cleave-rt/Cargo.toml`'s own doc comment) -- without this step,
      # every test that really calls `cleave_blas_sgemm` (`tests/blas.rs`,
      # `examples/blas_demo.cleave`) fails to find it. The script itself
      # skips the download when the cached copy already matches
      # `ci/openblas-version.txt`.
      - name: Cache prebuilt OpenBLAS
        uses: actions/cache@v4
        with:
          path: target/openblas
          key: cleave-openblas-${{ runner.os }}-${{ hashFiles('ci/openblas-version.txt') }}

      - name: Download prebuilt OpenBLAS
        shell: pwsh
        run: ./scripts/setup-openblas.ps1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No `--workspace` -- deliberately respects `Cargo.toml`'s own
      # `default-members` (running `digits-interop`/`mnist-interop` needs
      # real network access and minutes of training, a poor fit for an
      # ordinary CI sweep -- `Cargo.toml`'s own doc comment already explains
      # this). The example crates are built (and nanoLM tested) in their own
      # steps below, without running them.
      - name: cargo build
        run: cargo build --release

      # `RUST_MIN_STACK` -- `cargo test`'s own worker threads get an
      # ordinary, small default stack, regardless of `--release` --
      # confirmed directly to matter for real: deep e-graph/CPS recursion
      # in real tests (the same class of depth `cleave-build`'s own
      # dedicated 1GB build thread and `main.rs`'s own 1GB main-thread
      # stack already exist to give the *compiler* itself, `cleave-build/
      # src/lib.rs`'s own doc comment) overflows the default stack under
      # `cargo test` specifically, on both a local debug build and here in
      # CI -- this is the same fix already documented for that case,
      # applied where `cargo test` itself runs rather than left to each
      # developer's own shell.
      - name: cargo test
        run: cargo test --release --no-fail-fast
        env:
          RUST_MIN_STACK: "67108864"

      # The example crates outside `default-members`: no network and no
      # training here, but each one's `build.rs` compiles a real kernel
      # through the compiler, the largest code generation tests there are
      # (nanoLM's transformer above all). nanoLM's own unit tests (BPE,
      # corpus cleaning, data windows) need no corpus either.
      - name: nanoLM (kernel and unit tests)
        run: cargo test --release -p nanolm --no-fail-fast
        env:
          RUST_MIN_STACK: "67108864"

      - name: digits-interop and mnist-interop kernels
        run: cargo build --release -p digits-interop -p mnist-interop
