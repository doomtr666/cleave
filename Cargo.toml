[workspace]
members = ["cleave", "cleave-rt", "cleave-build", "examples/rust-interop-demo", "examples/digits-interop", "examples/mnist-interop"]
# `digits-interop`'s own `build.rs` used to compile a real MLP kernel through
# `derive()`, far too slow (many minutes) to sit in the ordinary `cargo
# build/test --workspace` sweep -- `doc/backlog.md`'s own "digits-interop"
# perf item redesigned the whole path (`grad()` instead of `derive()`, plus a
# real memref-descriptor fix for `Tensor`-typed struct fields) and closed
# that gap (`cargo build --release` now ~8s), but it's still excluded here:
# real network access (`examples/mnist-interop`'s own MNIST download) and a
# genuinely large, minutes-long training run (`digits-interop`'s own smaller
# UCI-digits run, `examples/mnist-interop`'s own much bigger MNIST one) are
# both a poor fit for an ordinary `cargo build`/`test` sweep regardless of
# compile time. `--workspace` explicitly still walks every member regardless
# of this list, so build/test either deliberately, not by habit.
default-members = ["cleave", "cleave-rt", "cleave-build", "examples/rust-interop-demo"]
resolver = "3"

[patch.crates-io]
# See doc/backlog.md item 1 (MLIR lowering) and the mlir-sys PR at
# https://github.com/mlir-rs/mlir-sys/pull -- three Windows/MSVC static-
# linking bugs (enum signedness, a doubled `.lib` suffix, and static-lib
# discovery assuming Unix `lib*.a` naming) all fixed here, none yet released
# upstream. A real `git` dependency (not a local `path`, which this project
# used until CI needed to build on a machine that obviously doesn't have
# `C:/dev/mlir-sys` -- a real portability gap for any fresh clone, not just
# CI, closed here rather than worked around) -- `doomtr666/mlir-sys`'s own
# `fix/windows-msvc-static-linking` branch, confirmed actually pushed there
# (`git ls-remote`), not just present in a local checkout.
mlir-sys = { git = "https://github.com/doomtr666/mlir-sys", branch = "fix/windows-msvc-static-linking" }
# tblgen 0.9.1 (crates.io) fails to build on MSVC -- its own bundled C++
# wrapper needs C++20, its build.rs forces C++17. Already fixed on `main`,
# just not released yet -- tracking `main` directly here since there's
# nothing of ours to patch.
tblgen = { git = "https://github.com/mlir-rs/tblgen-rs" }
